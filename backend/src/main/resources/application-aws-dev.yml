spring:
  config:
    activate:
      on-profile: aws-dev
  datasource:
    url: jdbc:postgresql://${APP_DB_HOST:localhost}:${APP_DB_PORT:5432}/${APP_DB_NAME:homeops}
    username: ${APP_DB_USER:homeops}
    password: ${APP_DB_PASSWORD:homeops_dev_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    db:
      enabled: true

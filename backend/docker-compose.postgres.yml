services:
  postgres:
    image: postgres:16.14
    container_name: homeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HOMEOPS_DB_NAME:-homeops}
      POSTGRES_USER: ${HOMEOPS_DB_USER:-homeops}
      POSTGRES_PASSWORD: ${HOMEOPS_DB_PASSWORD:-homeops_dev_password}
    ports:
      - "127.0.0.1:${HOMEOPS_DB_PORT:-5432}:5432"
    volumes:
      - homeops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HOMEOPS_DB_USER:-homeops} -d ${HOMEOPS_DB_NAME:-homeops}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  homeops-postgres-data: